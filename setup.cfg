# All configuration for plugins and other utils is defined here.
# Read more about `setup.cfg`:
# https://docs.python.org/3.11/distutils/configfile.html

[flake8]
# Base flake8 configuration:
# https://flake8.pycqa.org/en/latest/user/configuration.html
format = wemake
show-source = true
statistics = false
doctests = true

# Plugins:
max-complexity = 6
max-line-length = 80
max-imports = 25
max-arguments = 6

allowed-domain-names = data

# We only run wemake-python-styleguide and system checks:
select = WPS, E99

ignore =
  # Allow logic in `__init__`
  WPS412

# Excluding some directories:
extend-exclude =
  .venv
  # We don't care about style in purposely junk code:
  typesafety
  # We don't care about style of benchmark apps:
  benchmarks
  # Artifacts:
  docs/_build

# Ignoring some errors in some files:
per-file-ignores =
  # Having many components is fine:
  dmr/components.py: WPS202
  # Allow many imported names from a modules. Also allow wrong variables
  # names for to comply with the openapi convention (as `item`, `info`, etc):
  dmr/openapi/objects/*.py: WPS201, WPS110
  # We have complex modules with a lot of quircks:
  dmr/endpoint.py: WPS201, WPS203, WPS402, WPS404
  dmr/validation/endpoint_metadata.py: WPS201, WPS203, WPS402
  dmr/openapi/mappers/schema_loader.py: WPS202
  dmr/controller.py: WPS201, WPS203
  dmr/routing.py: WPS114, WPS201
  dmr/problem_details.py: WPS211, WPS226
  dmr/negotiation.py: WPS202
  dmr/throttling/*.py: WPS226
  # It is fine to have many exceptions:
  dmr/exceptions.py: WPS202
  # Base jwt auth, its header transport, and the request helpers
  # all have to live here, so the old import paths keep working:
  dmr/security/jwt/auth.py: WPS202
  # Compilation targets are a bit different:
  dmr/_compiled/*.py: WPS226, WPS231, WPS232, WPS402
  # Our test client has some autogenerated code:
  dmr/test/client.py: WPS475, WPS110
  # Complex code in test helpers:
  dmr/test/throttling.py: WPS202
  # Disable some lints for django models:
  dmr/security/*/models.py: WPS432, WPS601
  # We have many public test helpers,
  # throttling drivers also have many optional keyword-only knobs:
  # Many bundled pytest fixtures:
  dmr_pytest.py: WPS202
  # Disable some lints for test settings:
  django_test_app/server/settings.py: WPS226, WPS407
  # Ignore autogenerated migrations:
  django_test_app/server/apps/*/migrations/*.py: WPS102, WPS219, WPS301, WPS432, WPS458
  dmr/security/*/migrations/*.py: WPS102, WPS219, WPS301, WPS432, WPS458
  # Allow some strange code for models:
  django_test_app/server/apps/*/models.py: WPS601
  django_test_app/server/apps/*/models/*.py: WPS601
  # Disable some complexity checks for tests:
  django_test_app/server/apps/*/views.py: WPS202, WPS226, WPS402
  # Too many public classes due to sync+async pairs:
  dmr/security/jwt/views.py: WPS202
  # Enable string overuse tests, nested classes, and multiline strings:
  tests/*.py: WPS202, WPS204, WPS211, WPS218, WPS226, WPS430, WPS431, WPS462, WPS476
  # Enable to import annotations from __future__ for Sphinx extensions:
  docs/tools/sphinx_ext/*.py: WPS201, WPS202, WPS203, WPS204, WPS226, WPS402
  # Tests in doc examples are special:
  docs/examples/testing/*.py: WPS226
  # A grace period in days is not a magic number:
  docs/examples/auth/token/token_cleanup.py: WPS432

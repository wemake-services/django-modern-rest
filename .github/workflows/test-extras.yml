name: test-extras

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - "dmr/**"
      - "tests/**"
      - "django_test_app/**"
      - ".github/workflows/test-extras.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pypy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['pypy3.11']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

    - name: Install dependencies
      run: |
        uv sync --group unit-test --no-group dev \
          --no-extra msgspec --no-extra attrs --all-extras

    - name: Run checks
      run: uv run --no-sync python -m pytest tests/test_unit -o addopts=""


  test-django-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
        django-version:
          - 'Django~=5.0.0'
          - 'Django~=5.1.0'
          - 'Django~=6.0.0'
          - 'Django~=6.1.0'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

    - name: Install just
      run: uv tool install rust-just

    - name: Install dependencies
      run: |
        uv sync --all-extras --group integration
        uv pip install "${{ matrix.django-version }}"

    - name: Run checks
      run: |
        just smoke jwt msgspec pydantic
        just unit --cov-fail-under=98


  build-no-msgspec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

    - name: Install just
      run: uv tool install rust-just

    - name: Install dependencies
      run: uv sync --no-extra msgspec --no-extra attrs --all-extras --group integration

    - name: Run checks
      run: |
        just smoke jwt pydantic
        just example
        uv run python -m pytest -n auto --max-worker-restart=1 --cov-fail-under=90


  build-no-pydantic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

    - name: Install just
      run: uv tool install rust-just

    - name: Install dependencies
      run: uv sync --no-extra pydantic --all-extras --group integration

    - name: Run checks
      run: |
        just smoke jwt msgspec
        uv run python -m pytest tests/test_unit/test_plugins/test_msgspec \
          --cov-fail-under=50


  build-no-serializers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

    - name: Install just
      run: uv tool install rust-just

    - name: Install dependencies
      run: uv sync --extra jwt

    - name: Run checks
      run: just smoke jwt

  build-no-extras:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

    - name: Install just
      run: uv tool install rust-just

    - name: Install dependencies
      run: uv sync

    - name: Run checks
      run: just smoke

name: test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        redis-image: ['redis:8-alpine']
        include:
          - python-version: '3.14t'
            force-free-gil: true
          - python-version: '3.13'
            redis-image: 'valkey/valkey:9-alpine'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - name: Install just
      run: uv tool install rust-just

    - name: Install dependencies
      run: |
        # System deps:
        sudo apt update && sudo apt install -y gettext wait-for-it

        # Python deps:
        just install
        # We don't install `orjson` in `pyproject.toml`,
        # because we run `3.14t` as well and it cannot be installed there :(
        # No way to exclude the platform on a file level.
        uv pip install orjson || true

    - name: Prefetch the image
      run: docker pull "${{ matrix.redis-image }}"

    - name: Run checks
      run: just test
      env:
        PYTHON_GIL: ${{ matrix.force-free-gil && '0' || '1' }}
        REDIS_IMAGE: ${{ matrix.redis-image }}

    # Upload coverage to codecov: https://codecov.io/
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Tracecov report
      run: cat tracecov-report.md >> "$GITHUB_STEP_SUMMARY"

name: skill-evals

# Behavioral evals for the agent skills shipped in `dmr/.agents/skills`.
# They call the Claude API, so they run on a schedule and on demand,
# not on every pull request. Docs: https://code.claude.com/docs/en/plugin-evals

on:
  workflow_dispatch:
  schedule:
    # First day of every month, 06:00 UTC:
    - cron: '0 6 1 * *'

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    if: github.repository == 'wemake-services/django-modern-rest'
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

    - name: Validate skills against the Agent Skills specification
      run: |
        for skill in dmr/.agents/skills/*/; do
          uvx --from skills-ref agentskills validate "$skill"
        done

    - name: Install Claude Code
      run: |
        curl -fsSL https://claude.ai/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run the `dmr` skill evals
      working-directory: dmr/.agents/skills/dmr
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        claude plugin eval . \
          --trust-plugin \
          --json results.json \
          --threshold 0.8 \
          --model claude-sonnet-5 \
          --judge-model claude-haiku-4-5 \
          --no-publish \
          --max-cost-usd 10

    - name: Upload eval results
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: skill-evals
        path: |
          dmr/.agents/skills/dmr/results.json
          dmr/.agents/skills/dmr/evals/results/
        if-no-files-found: ignore

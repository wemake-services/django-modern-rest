[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-fancy-pypi-readme", "hatchling" ]


[project]
name = "django-modern-rest"
version = "0.14.0"
description = "Modern REST framework for Django with types and async support"
keywords = [
  "API",
  "django",
  "django plugin",
  "django-api",
  "djangorestframework",
  "REST",
  "wemake-python-package",
]
license = "MIT"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: AsyncIO",
  "Framework :: Django",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dynamic = [ "readme" ]
dependencies = [
  "django>=5,<6.2",
  "typing-extensions>=4.12",
]

[[project.authors]]
name = "Nikita Sobolev"
email = "mail@sobolevn.me"

[[project.authors]]
name = "Alexander Kondratev"
email = "mail@kondratev.dev"

[[project.authors]]
name = "Alexey Potapov"
email = "me@black-as-ink.ru"

[project.optional-dependencies]
pydantic = [ "pydantic[email,timezone]>=2.12", "pydantic-extra-types" ]
msgspec = [ "msgspec>=0.21.1" ]
attrs = [ "attrs>=26", "django-modern-rest[msgspec]" ]
jwt = [ "pyjwt[crypto]>=2.11" ]
openapi = [ "openapi-spec-validator>=0.8", "polyfactory>=3.2", "pyyaml" ]

[project.urls]
Documentation = "https://django-modern-rest.readthedocs.io/en/latest/"
Changelog = "https://github.com/wemake-services/django-modern-rest/releases"
GitHub = "https://github.com/wemake-services/django-modern-rest"
Funding = "https://github.com/sponsors/wemake-services"

[project.entry-points.pytest11]
# We need this structure because otherwise `pytest` ruins the coverage report.
# This happens because we have imports in `dmr/__init__.py`
dmr = "dmr_pytest"


[dependency-groups]
dev = [
  "dennis>=1.2,<2",
  "django-stubs[compatible-mypy]>=6.1,<6.2",
  "import-linter>=2.5,<3",
  "phonenumbers>=9,<10",
  "pyrefly>=1,<2",
  # TODO: update after `mypy` and `pyrefly` will support `EMPTY` as a type:
  "pyright>=1.1,<1.1.410",
  "ruff>=0.16,<0.17",
  "schemathesis>=4.14,<5",
  "slotscheck>=0.19,<0.21",
  # TODO: relax the pin after a stable `ty` release:
  "ty==0.0.75",
  "types-django-filter>=25.2,<27",
  "types-docker>=7.2,<8",
  "types-docutils>=0.22,<0.24",
  "types-pyyaml>=6,<7",
  "types-redis>=4.6,<5",
  "types-setuptools>=82,<85",
  "wemake-python-styleguide[mcp]>=1.8,<2",
  { include-group = "dev-and-docs" },
  { include-group = "integration" },
  { include-group = "unit-test" },
]
docs = [
  "django-filter>=25.2,<27",
  "django-mantle>=26.6,<27",
  "django-modern-schemas>=0.1.1,<0.2",
  "docutils>=0.22,<0.23",
  "myst-parser>=5,<6",
  "shibuya>=2026.1,<2027",
  "sphinx>=9,<10",
  "sphinx-autodoc-typehints>=3,<4",
  "sphinx-contributors>=0.2,<0.4",
  "sphinx-copybutton>=0.5,<0.6",
  "sphinx-design>=0.7,<0.8",
  "sphinx-iconify>=0.3,<0.4",
  "sphinx-llms-txt>=0.7,<0.8",
  "sphinx-tabs>=3.5,<4",
  "sphinxcontrib-mermaid>=2,<3",
  # Needed for our extension:
  "uvicorn>=0.52,<0.53",
  # Needed for examples:
  "xmltodict-rs>=0.13,<0.14",
  "zapros>=0.15,<0.18",
  { include-group = "dev-and-docs" },
]
build = [
  # NOTE: Keep cibuildwheel in sync with action version in build-wheels.yml
  "cibuildwheel==4.2",
  "pypyp>=1.3,<2",
]
dev-and-docs = [
  # Needed for auth examples:
  "django-allauth>=65.4,<66",
  # Needed for the micro-framework examples:
  "nanodjango>=0.16,<0.17",
  "punq>=0.8,<1",
]
integration = [
  "pytest-codspeed>=4.3,<6",
  "testcontainers[redis]>=4.15,<5",
  "tracecov>=0.23,<0.25",
]
# This is a special group, it has special rules.
# It is installed in `cibuildwheel` and must be minimal.
unit-test = [
  "covdefaults>=2.3,<3",
  "dirty-equals>=0.11,<0.12",
  # Pin to Django 5.2 (LTS): it supports Python 3.11+, while Django 6.0
  # requires Python 3.12+. CI runs different django versions as separate jobs
  "django~=5.2.0",
  "django-allauth",
  "django-csp>=4,<5",
  "faker>=40.36,<41",
  "inline-snapshot>=0.35,<0.36",
  # We don't install `orjson` on 3.14, because we run `3.14t` as well,
  # but no way to disable it specifically for `t` version :(
  "orjson>=3.11,<4; python_version<'3.14' and implementation_name=='cpython'",
  "polyfactory>=3.2,<4",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "pytest-django>=4.12,<4.15",
  "pytest-freezer>=0.4,<0.5",
  "pytest-randomly>=4,<5",
  "pytest-timeout>=2.4,<3",
  "pytest-xdist>=3.8,<4",
  "syrupy>=5.1,<7",
  "xmltodict-rs>=0.13,<0.14",
]


[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [ { path = "README.md" } ]

[tool.hatch.build.targets.wheel.hooks.mypyc]
enable-by-default = false
dependencies = [ "hatch-mypyc", "mypy==2.3.0" ]
include = [ "dmr/_compiled" ]
require-runtime-dependencies = true
mypy-args = [ "--ignore-missing-imports" ]
options = { debug_level = "0", opt_level = "3" }

[tool.hatch.build.targets.sdist]
include = [
  "dmr/",
  "dmr_pytest.py",
  "LICENSE",
  "licenses/*.txt",
]

[tool.hatch.build.targets.wheel]
macos-max-compat = true
only-include = [ "dmr", "dmr_pytest.py" ]


[tool.uv]
# Docs: https://docs.astral.sh/uv/reference/settings
add-bounds = "major"


[tool.cibuildwheel]
# Build CPython 3.11-3.14 only; skip 32-bit and musl targets.
build = "cp3{11,12,13,14}-*"
skip = [
  "cp313t-*",
  "*-win32",
  "*-macosx_x86_64", # cryptography does not support it anymore
]
build-frontend = "uv"
build-verbosity = 1
before-test = [
  """\
  uv export --format requirements.txt --group unit-test --no-group dev \
  --all-extras > _temp.txt\
  """,
  "uv pip install -r _temp.txt",
]
test-command = 'pytest {project}/tests/test_unit -o addopts=""'

[tool.cibuildwheel.environment]
HATCH_BUILD_HOOKS_ENABLE = "1"
CC = "clang"

[tool.cibuildwheel.linux]
before-all = [
  "yum install -y llvm-toolset || yum -v install -y llvm-toolset",
]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"

[[tool.cibuildwheel.overrides]]
select = "*musllinux*"
before-all = [
  "apk add --no-cache clang",
]


[tool.ruff]
target-version = "py311"
line-length = 80
# Ruff config: https://docs.astral.sh/ruff/settings
preview = true
fix = true
output-prefer-rule-codes = true

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
# Allow imports inside fixtures:
"dmr_pytest.py" = [ "PLC0415" ]
# Allow internals access in `django`:
"dmr/internal/django.py" = [ "SLF001" ]
# Our test utilities are built on asserts:
"dmr/test/*.py" = [ "S101" ]
# Do not require docstrings in test project:
"django_test_app/**/*.py" = [ "D10" ]
# Ignore many rules in autogenerated migrations:
"dmr/security/*/migrations/*.py" = [ "D101", "E501", "RUF012" ]
"django_test_app/server/apps/*/migrations/*.py" = [ "D101", "E501", "RUF012" ]
# Allow asserts and private name imports and access for tests:
"tests/*.py" = [ "PLC2701", "RUF012", "S101", "SLF001" ]
# Allow examples to be a bit less strict:
"docs/examples/**/*.py" = [ "D1", "S1" ]
# Unittest examples must use unittest features:
"docs/examples/testing/*.py" = [ "PT009" ]
# Never ask for crypto safety in these example:
"docs/examples/external_views/*.py" = [ "S311" ]
# Allow benchmarks to not have docs and do scripting:
"benchmarks/**/*.py" = [ "D", "S" ]
"typesafety/**/*.py" = [ "D" ]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TypedDict".msg = "Use typing_extensions.TypedDict instead."

[tool.ruff.lint]
select = [
  "A",     # flake8-builtins
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "C90",   # mccabe
  "COM",   # flake8-commas
  "D",     # pydocstyle
  "DJ",    # flake8-django
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle
  "ERA",   # flake8-eradicate
  "EXE",   # flake8-executable
  "F",     # pyflakes
  "FBT",   # flake8-boolean-trap
  "FLY",   # pyflint
  "FURB",  # refurb
  "G",     # flake8-logging-format
  "I",     # isort
  "ICN",   # flake8-import-conventions
  "INT",   # flake8-gettext
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "N",     # pep8-naming
  "PERF",  # perflint
  "PIE",   # flake8-pie
  "PL",    # pylint
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "Q",     # flake8-quotes
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # ruff
  "S",     # flake8-bandit
  "SIM",   # flake8-simplify
  "SLF",   # flake8-self
  "SLOT",  # flake8-slots
  "T100",  # flake8-debugger
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle
  "YTT",   # flake8-2020
]
ignore = [
  "A005",     # allow to shadow stdlib and builtin module names
  "ASYNC119", # `contextlib.aclosing` is not detected
  # Different doc rules that we don't really care about:
  "D100",
  "D104",
  "D106",
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "D418",     # We should be able to add docstrings to `@overload` decorators
  "D421",
  "DJ008",    # we don't need `__str__` in models in tests
  "ISC001",   # implicit string concat conflicts with `ruff format`
  "ISC003",   # prefer explicit string concat over implicit concat
  "PLC0414",  # do not raise on `as` re-exports
  "PLR09",    # we have our own complexity rules
  "PLR2004",  # do not report magic numbers
  "PLR6301",  # do not require classmethod / staticmethod when self not used
  "PLW2901",  # allow to redefine iteration targets in for loops
  "RUF029",   # we decide `async` functions based on API, not `await` usage
  "RUF067",   # wps handles `__init__.py` logic better
  "RUF105",   # keep old `# noqa` comments style, not `# ruff` comments
  "RUF106",   # we prefer old error codes
  "RUF201",   # keep old rule codes instead of verbose names
  "TRY003",   # long exception messages from `tryceratops`
]
external = [ "WPS" ]
flake8-gettext.extend-function-names = [ "_" ]
# Plugin configs:
flake8-quotes.inline-quotes = "single"
# For `django_test_app` and `docs` only:
isort.known-first-party = [ "server", "examples" ]
mccabe.max-complexity = 6
pydocstyle.convention = "google"


[tool.codespell]
# codespell configuration: https://github.com/codespell-project/codespell
skip = [
  "*.css",
  "*.js",
  "*.lock",
  "*.min.*",
  "*.msgpack",
  ".mypy_cache",
  "__pycache__",
  "_build",
  "benchmarks/*.json",
  "dmr/locale/**",
  "dmr/static/*",
  "swagger-*.js",
]


[tool.pyproject-fmt]
# Docs: https://pyproject-fmt.readthedocs.io/en/latest/configuration.html
column_width = 80
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n\n"


[tool.typos]

# Docs: https://github.com/crate-ci/typos
[tool.typos.default]
extend-identifiers = { _SerT = "_SerT" }

[tool.typos.files]
extend-exclude = [
  "__pycache__",
  "_build",
  ".mypy_cache",
  "swagger-*.js",
  "dmr/static",
  "*.js",
  "*.css",
  "*.min.*",
  "*.msgpack",
  "dmr/locale",
  "*.lock",
  "benchmarks/*.json",
]


[tool.mypy]
exclude = [
  # We don't care about benchmark code:
  "benchmarks/",
  # It has its own type-checking setup, since uses django:
  "django_test_app/",
  # We don't care about built docs:
  "docs/_build/",
]
warn_unreachable = true
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]
# The mypy configurations: http://bit.ly/2zEl9WI
extra_checks = true
strict_equality_for_none = true
strict = true
plugins = [
  "pydantic.mypy",
]

[[tool.mypy.overrides]]
# `nanodjango` does not ship a `py.typed` marker,
# it is only used in the micro-framework docs example:
module = [ "nanodjango.*" ]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `django-allauth` does not ship a `py.typed` marker:
module = [ "allauth.*" ]
ignore_missing_imports = true


[tool.pyrefly]
# Docs: https://pyrefly.org
project-includes = [ "dmr", "dmr_pytest.py", "tests", "typesafety" ]
min-severity = "warn"
preset = "strict"

[tool.pyrefly.errors]
implicit-any-attribute = false
implicit-any-empty-container = false
implicit-any-lambda = false
unused-ignore = true


[tool.pyright]
venv = ".venv"
venvPath = "."
strict = [ "dmr/**/*", "dmr_pytest.py", "typesafety/**/*" ]
# Docs: https://microsoft.github.io/pyright/#/configuration
include = [ "dmr", "dmr_pytest.py", "tests", "typesafety" ]
exclude = [
  # It has a lot of ugly code:
  "dmr/internal/django.py",
]


[tool.ty]

[tool.ty.src]
include = [ "typesafety/" ]

# More details at https://docs.astral.sh/ty/coming-from-mypy-or-pyright/#stricter-checking-with-ty
[tool.ty.analysis]
strict-literal-narrowing = true
strict-generic-narrowing = true
# `ty` has its own error codes for `# type: ignore`
respect-type-ignore-comments = false


[tool.pytest.ini_options]
# PYTHONPATH configuration:
# `docs` is here, so `.rst` doctests can import `examples.*`
# the same way our sphinx extension does:
pythonpath = [ "django_test_app", "docs" ]
# Extra options:
addopts = [
  # pytest-xdist is only applied to some envs, not all tests
  "--strict-config",
  "--strict-markers",
  "--doctest-modules",
  "--doctest-glob=*.rst",
  "--doctest-glob=README.md",
  # Output:
  "--tb=short",
  # Coverage:
  "--cov=dmr",
  "--cov=django_test_app",
  "--cov=tests",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=html",
  "--cov-report=xml",
  "--cov-branch",
  "--cov-fail-under=100",
  # Tracecov:
  "--tracecov-format=text,html,markdown",
  "--tracecov-fail-under-operations=100",
  "--tracecov-fail-under-examples=100",
  # TODO: set value to 100
  "--tracecov-fail-under-parameters=90",
  "--tracecov-fail-under-keywords=95",
  "--tracecov-fail-under-responses=50",
  # Ignores benchmarks:
  "--ignore=benchmarks/",
  # Ignores docs:
  "--ignore=docs/conf.py",
  "--ignore=docs/examples/",
  "--ignore=docs/tools/",
  "--ignore=docs/_build/",
  # Ignores typesafety tests:
  "--ignore=typesafety/assert_type",
  # Ignores optional deps:
  "--ignore=dmr/plugins/msgspec",
  # Ignores compiled:
  "--ignore=dmr/_compiled",
]
# pytest config: http://doc.pytest.org/en/latest/customize.html
# Strict `@xfail` by default:
xfail_strict = true
# Fail on warnings:
filterwarnings = [ "error" ]
# pytest-asyncio configuration:
# https://pytest-asyncio.readthedocs.io/en/stable/reference/configuration.html
asyncio_mode = "auto"
# Django options:
# https://pytest-django.readthedocs.io/en/latest/
DJANGO_SETTINGS_MODULE = "server.settings"
# pytest-timeout configuration:
# https://github.com/pytest-dev/pytest-timeout
timeout = 5
timeout_method = "thread"


[tool.coverage.run]
# Covdefaults: https://pypi.org/project/covdefaults
plugins = [ "covdefaults" ]


[tool.slotscheck]
# https://slotscheck.readthedocs.io/en/latest/configuration.html
strict-imports = true
require-subclass = true
exclude-slots = '''
(
  dmr\.streaming\.sse\.metadata:(SSEvent|_SSEventSlots)\._serialize
  |dmr\._compiled\.negotiation:_MediaTypeHeader
)
'''
exclude-modules = '''
(
  dmr\.security\.jwt\.blocklist
  |dmr\.security\.django_session\.views
  |dmr\.security\.jwt\.views
  |dmr\.security\.token\.views
  |dmr\.security\.token\.app
  |dmr\.internal\.model_fields
)
'''

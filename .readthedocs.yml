version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.12"
  pre_build:
    - export PYTHONPATH="${PYTHONPATH}:${READTHEDOCS_VIRTUALENV_PATH}/../../checkouts/${READTHEDOCS_VERSION}/docs"
    - export UV_LINK_MODE=copy
  commands:
    - asdf plugin add uv
    - asdf install uv latest
    - asdf global uv latest
    - uv export
      --all-extras
      --group docs
      --no-emit-project
      --format=requirements.txt
      --output-file=requirements.txt
    - uv venv $READTHEDOCS_VIRTUALENV_PATH --seed
    - uv pip install . -r requirements.txt
    - python -m sphinx -T -W --keep-going -b html -d _build/doctrees -D language=en docs $READTHEDOCS_OUTPUT/html
